<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binalar</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.2/firebase-database.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f7fc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin-top: 50px;
            padding: 30px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            color: #4CAF50;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        ul {
            list-style-type: disc;
            padding-left: 20px;
            font-size: 1.2rem;
        }

        li {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Binalar</h1>
        <ul id="bina-listesi">
            <!-- Firebase’den veri geldikçe buraya liste eklenecek -->
        </ul>

        <script>
            // Firebase konfigürasyonunu buraya ekle
            const firebaseConfig = {
                apiKey: "YOUR_API_KEY",
                authDomain: "YOUR_AUTH_DOMAIN",
                databaseURL: "YOUR_DATABASE_URL",
                projectId: "YOUR_PROJECT_ID",
                storageBucket: "YOUR_STORAGE_BUCKET",
                messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
                appId: "YOUR_APP_ID"
            };

            // Firebase başlat
            const app = firebase.initializeApp(firebaseConfig);
            const database = firebase.database();

            // Binalar ile ilgili değişkenler
            let binalarListesi = [];       // Firebase’den çekilecek binalar listesi

            // Örnek: Firebase’den veri çekme fonksiyonu
            function fetchBinalar() {
                const binalarRef = firebase.database().ref('binalar');
                binalarRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    binalarListesi = data ? Object.keys(data) : [];

                    // HTML listesine ekle
                    const ul = document.getElementById('bina-listesi');
                    ul.innerHTML = ''; // Önce temizle
                    binalarListesi.forEach((bina, index) => {
                        const li = document.createElement('li');
                        li.textContent = bina; // Örn: "Bina 1"
                        ul.appendChild(li);
                    });
                });
            }

            // Örnek statik veri (Firebase yoksa test için)
            function loadStaticBinalar() {
                binalarListesi = ["Bina 1", "Bina 2", "Bina 3"];
                const ul = document.getElementById('bina-listesi');
                ul.innerHTML = '';
                binalarListesi.forEach((bina) => {
                    const li = document.createElement('li');
                    li.textContent = bina;
                    ul.appendChild(li);
                });
            }

            // Fonksiyonları çağır
            // Eğer Firebase hazırsa fetchBinalar(); kullan, yoksa loadStaticBinalar();
            loadStaticBinalar();
            // fetchBinalar(); // Firebase kullanıyorsan bunu aç
        </script>
    </div>
</body>
</html>
