<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Population Map - Grafik Paneli</title>
    
    <!-- Grafik çizimi için Chart.js CDN kütüphanesini yüklüyoruz -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-container {
            width: 90%;
            max-width: 800px;
            background: white;
            padding: 20px 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            box-sizing: border-box;
            align-items: center;
        }
        .form-container input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
        }
        .form-container button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .form-container button:hover {
            background-color: #2563eb;
        }
        .container {
            width: 90%;
            max-width: 800px;
            background: white;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Veri Giriş Paneli -->
    <div class="form-container">
        <input type="text" id="dataLabel" placeholder="Zaman/Etiket (Örn: 12:00)">
        <input type="number" id="dataValue" placeholder="Değer (Örn: 150)">
        <button id="sendBtn">Veri Ekle</button>
    </div>

    <!-- Grafik Alanı -->
    <div class="container">
        <h1>Nüfus Haritası Veri Grafiği</h1>
        <canvas id="myChart"></canvas>
    </div>
