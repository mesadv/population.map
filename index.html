<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Population Map - Grafik Paneli</title>
    
    <!-- Grafik çizimi için Chart.js CDN kütüphanesini yüklüyoruz -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 800px;
            background: white;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
        }
        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nüfus Haritası Veri Grafiği</h1>
        <!-- Grafik bu Canvas elementi üzerine çizilecek -->
        <canvas id="myChart"></canvas>
    </div>

    <!-- Firebase v10 Modüllerini yüklemek için type="module" kullanıyoruz -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Proje bilgilerinizi içeren yapılandırma nesnesi
        const firebaseConfig = {
            apiKey: "AIzaSyCVp9jSagLcb8v6Ei2dhmpQrJAWSYxgZ48", // Buraya gerçek API Key değerinizi yapıştırın [1]
            authDomain: "populationmap-48dd0.firebaseapp.com",
            databaseURL: "https://populationmap-48dd0-default-rtdb.firebaseio.com",
            projectId: "populationmap-48dd0",
            storageBucket: "populationmap-48dd0.firebasestorage.app",
            messagingSenderId: "387203070252",
            appId: "1:387203070252:web:b0ed4f1ff520f6f2bc5489" // Buraya gerçek Web App ID değerinizi yapıştırın [1]
        };

        // Firebase'i başlat
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Chart.js grafiğini oluşturma
        const ctx = document.getElementById('myChart').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // Zaman damgaları veya anahtarlar
                datasets: [{
                    label: 'Anlık Veri Akışı',
                    data: [], // Firebase'den gelen değerler
                    borderColor: 'rgba(59, 130, 246, 1)',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: true }
                },
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });

        // Veriyi Firebase'ten çekip grafiği güncelleme fonksiyonu
        function fetchDataAndUpdateChart() {
            const dbRef = ref(database, 'veriler');
            
            get(dbRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const labels = [];
                    const values = [];

                    // Gelen nesneyi döngüyle ayrıştırma
                    for (let key in data) {
                        labels.push(key); 
                        values.push(data[key].value);
                    }

                    // Grafik verilerini güncelleme ve yeniden çizme
                    chart.data.labels = labels;
                    chart.data.datasets[0].data = values;
                    chart.update();
                } else {
                    console.log("'veriler' düğümü altında hiç veri yok.");
                }
            }).catch((error) => {
                console.error("Veri alınırken hata oluştu:", error);
            });
        }

        // Sayfa ilk açıldığında veriyi bir kere çek
        fetchDataAndUpdateChart();

        // Her 5 saniyede bir veriyi yenile
        setInterval(fetchDataAndUpdateChart, 5000); 
    </script>
</body>
</html>
