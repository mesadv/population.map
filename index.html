<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BİKSS</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:30px;font-family:Segoe UI,Tahoma,sans-serif;background:linear-gradient(135deg,#eef7f0,#dff4e5)}
.container{max-width:1500px;margin:auto;background:#fff;border-radius:18px;box-shadow:0 15px 40px rgba(0,0,0,.12);padding:35px}
h1{text-align:center;color:#1b5e20;margin:0 0 30px;font-size:2rem}
.lists{display:flex;gap:20px}
.panel{flex:1;background:#fff;border-radius:16px;box-shadow:0 8px 25px rgba(0,0,0,.08);padding:20px}
.panel h2{text-align:center;color:#2e7d32}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:12px;border-bottom:1px solid #e5e7eb;word-break:break-word}
th{background:#2e7d32;color:#fff}
th:nth-child(1),td:nth-child(1){width:30%}
th:nth-child(2),td:nth-child(2){width:50%}
th:nth-child(3),td:nth-child(3){width:20%;text-align:center}
tbody tr:hover{background:#edf8ef}
.site-box{border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:15px}
.site-header{background:linear-gradient(90deg,#43a047,#2e7d32);color:#fff;padding:16px;cursor:pointer;font-weight:600}
.site-content{max-height:0;overflow:hidden;transition:max-height .35s ease;background:#fff}
.site-box.open .site-content{max-height:800px}
.loading,.no-data{text-align:center;color:#666;padding:20px}
@media(max-width:900px){.lists{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<h1>Bina İçi Kişi Sayma Sistemi</h1>
<div class="lists">
<div class="panel">
<h2> Siteler</h2>
<div id="sites-container">
<div class="site-box">
<div class="site-header" data-name="Örnek Site">▶ Örnek Site</div>
<div class="site-content">
<table>
<thead><tr><th>Bina</th><th>Adres</th><th>Kişi</th></tr></thead>
<tbody><tr><td colspan="3" class="loading">app.js ile doldurulacak...</td></tr></tbody>
</table>
</div>
</div>
</div>
</div>
<div class="panel">
<h2> Apartmanlar</h2>
<table>
<thead><tr><th>Bina Adı</th><th>Açık Adres</th><th>Kişi Sayısı</th></tr></thead>
<tbody id="apartments-table-body">
<tr><td colspan="3" class="loading">Veriler Firebase'den yükleniyor...</td></tr>
</tbody>
</table>
</div>
</div>
</div>
<script>
document.addEventListener("click",e=>{
 if(e.target.classList.contains("site-header")){
  const box=e.target.parentElement;
  box.classList.toggle("open");
  const n=e.target.dataset.name;
  e.target.textContent=(box.classList.contains("open")?"▼ ":"▶ ")+n;
 }
});
</script>
<script type="module" src="app.js"></script>
</body>
</html>
