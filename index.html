<title>Bina İçi Kişi Sayma Sistemi</title>
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Population Map - Bina Listesi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin: 0 0 20px;
            font-size: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #fff;
            table-layout: fixed;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            overflow-wrap: anywhere;
        }

        th:nth-child(1),
        td:nth-child(1) {
            width: 30%;
        }

        th:nth-child(2),
        td:nth-child(2) {
            width: 50%;
        }

        th:nth-child(3),
        td:nth-child(3) {
            width: 20%;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }

        .loading,
        .no-data {
            text-align: center;
            color: #6b7280;
            padding: 20px;
        }

        .error {
            color: red;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.2rem;
            }

            th,
            td {
                padding: 10px 8px;
                font-size: 0.85rem;
            }

            th {
                font-size: 0.72rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Bina İçi Kişi Sayma Sistemi</h1>

        <table>
            <thead>
                <tr>
                    <th>Bina Adı</th>
                    <th>Açık Adres</th>
                    <th>Kişi Sayısı</th>
                </tr>
            </thead>

            <tbody id="data-table-body">
                <tr>
                    <td colspan="3" class="loading">
                        Veriler Firebase'den yükleniyor...
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
